# Default profile: Oracle, the production database. Other profiles:
#   local - embedded H2 file database with demo data; needs nothing but Java
#   mysql - a local MySQL 8 (docker compose up mysql)
spring:
  application:
    name: dso-portal
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:DSO_PORTAL}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # Keep the upper case names of the mappings: MySQL table names are case sensitive on Linux.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    locations: classpath:db/migration/oracle

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dso:
  # BBH-wide values written into every generated config.yaml; a service may override them in its additional YAML.
  defaults:
    asoc-url: ${DSO_ASOC_URL:https://bbh.cloud.appscan.com}
    sonar-server-url: ${DSO_SONAR_URL:https://tools.bbh.com/sonar}
    nexus-iq-server-url: ${DSO_NEXUS_IQ_URL:https://tools.bbh.com/IQ}
    nexus-iq-credentials-id: ${DSO_NEXUS_IQ_CREDENTIALS_ID:nexusiqP}
    influx-write-url: ${DSO_INFLUX_WRITE_URL:http://qcwsecopsmon1.testbbh.com:8086/api/v2/write?org=DevSecOps&bucket=DORA-metrics&precision=s}
    influx-credentials-id: ${DSO_INFLUX_CREDENTIALS_ID:influxdb-token}
  # InfluxDB the pipelines write to, read by the monitoring pages. Leave the URL empty to switch monitoring off.
  influx:
    url: ${INFLUX_URL:}
    org: ${INFLUX_ORG:DevSecOps}
    bucket: ${INFLUX_BUCKET:DORA-metrics}
    token: ${INFLUX_TOKEN:}
  # Grafana whose panels are embedded in the pipeline details. Leave the URL empty to hide the panels.
  grafana:
    url: ${GRAFANA_URL:}
    org-id: ${GRAFANA_ORG_ID:1}
  # Sample products, services and pipelines created at start-up when the database holds no product.
  demo-data: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dso-portal;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # H2 reports Oracle NUMBER columns with other JDBC types, so the schema is validated on Oracle and MySQL only.
      ddl-auto: none
dso:
  demo-data: true
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dso_portal}
    username: ${DB_USERNAME:dso_portal}
    password: ${DB_PASSWORD:dso_portal}
  flyway:
    locations: classpath:db/migration/mysql
dso:
  demo-data: ${DSO_DEMO_DATA:true}
