apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: beadle-internal-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=qc
      # The systems of qc: fill in each URL before applying; Beadle-Internal does not start while one is blank.
      - JIRA_URL=
      - CYBERTRACK_URL=
      - CONFLUENCE_URL=
      - QTEST_URL=
