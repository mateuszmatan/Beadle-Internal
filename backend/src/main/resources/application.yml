# Default profile: Oracle, the production database. Other profiles:
#   local - embedded H2 file database with demo data; needs nothing but Java
#   mysql - a local MySQL 8 (docker compose up mysql)
spring:
  application:
    name: dso-portal
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:DSO_PORTAL}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # Keep the upper case names of the mappings: MySQL table names are case sensitive on Linux.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        # Loads the lists of many services (test jobs, deployment targets, UrbanCode applications) in batches.
        default_batch_fetch_size: 50
  # The schema: Liquibase changesets for Oracle (also run on H2) and MySQL, see db/changelog.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dso:
  # The BBH-wide pipeline settings (tool addresses, scan policy, defaults) are not configured here: they are stored
  # in the database and edited in the portal's DevSecOps Global Settings tab.
  # InfluxDB the pipelines write to, read by the monitoring pages. Leave the URL empty to switch monitoring off.
  influx:
    url: ${INFLUX_URL:}
    org: ${INFLUX_ORG:DevSecOps}
    bucket: ${INFLUX_BUCKET:DORA-metrics}
    token: ${INFLUX_TOKEN:}
  # Grafana whose panels are embedded in the pipeline details. Leave the URL empty to hide the panels.
  grafana:
    url: ${GRAFANA_URL:}
    org-id: ${GRAFANA_ORG_ID:1}
  # Sample products, services and pipelines created at start-up when the database holds no product.
  demo-data: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dso-portal;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # H2 reports Oracle NUMBER columns with other JDBC types, so the schema is validated on Oracle and MySQL only.
      ddl-auto: none
dso:
  demo-data: true
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dso_portal}
    username: ${DB_USERNAME:dso_portal}
    password: ${DB_PASSWORD:dso_portal}
dso:
  demo-data: ${DSO_DEMO_DATA:true}
