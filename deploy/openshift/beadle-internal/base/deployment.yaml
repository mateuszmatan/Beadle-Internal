apiVersion: apps/v1
kind: Deployment
metadata:
  name: beadle-internal
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: beadle-internal
          image: beadle-internal
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: beadle-internal-config
            - secretRef:
                name: beadle-internal-db
            # BEADLE_SERVICE_TOKEN, the one token Beadle-GUI, Beadle-Internal and Beadle-ProTech share in the project
            - secretRef:
                name: beadle-services
            - secretRef:
                name: beadle-internal-jira
            - secretRef:
                name: beadle-internal-cybertrack
            - secretRef:
                name: beadle-internal-confluence
            - secretRef:
                name: beadle-internal-qtest
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /application/logs
      volumes:
        - name: logs
          emptyDir: {}
