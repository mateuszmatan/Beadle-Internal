spring:
  application:
    name: beadle-internal
  profiles:
    default: local
    group:
      rd: oracle
      qc: oracle
      prod: oracle
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
          preferred_boolean_jdbc_type: INTEGER
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    analytics-enabled: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bbh.itss.beadle: INFO

beadle:
  services:
    token: ${BEADLE_SERVICE_TOKEN:}
  gui:
    url: ${BEADLE_GUI_URL:http://localhost:8081}
  jira:
    url: ${JIRA_URL:}
    token: ${JIRA_TOKEN:}
    demo: ${JIRA_DEMO:false}
    epic-link-field: ${JIRA_EPIC_LINK_FIELD:customfield_10014}
  cybertrack:
    url: ${CYBERTRACK_URL:}
    token: ${CYBERTRACK_TOKEN:}
    demo: ${CYBERTRACK_DEMO:false}
    project-key: ${CYBERTRACK_PROJECT_KEY:SCP}
    issue-type: ${CYBERTRACK_ISSUE_TYPE:Task}
    poll: ${CYBERTRACK_POLL:PT5M}
  confluence:
    url: ${CONFLUENCE_URL:}
    token: ${CONFLUENCE_TOKEN:}
    demo: ${CONFLUENCE_DEMO:false}
  qtest:
    url: ${QTEST_URL:}
    token: ${QTEST_TOKEN:}
    demo: ${QTEST_DEMO:false}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:${BEADLE_INTERNAL_DATA_DIR:${user.home}/bbh-devsecops/beadle-internal}/beadle-internal;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoint:
    health:
      show-details: always
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
---
spring:
  config:
    activate:
      on-profile: rd
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.bbh.itss.beadle: DEBUG
---
spring:
  config:
    activate:
      on-profile: qc
management:
  endpoint:
    health:
      show-details: always
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
