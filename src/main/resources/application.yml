spring:
  application:
    name: beadle-internal
  profiles:
    default: local
    group:
      rd: oracle
      qc: oracle
      prod: oracle
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  liquibase:
    analytics-enabled: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

beadle:
  services:
    token: ${BEADLE_SERVICE_TOKEN:}
  gui:
    url: ${BEADLE_GUI_URL:http://localhost:8081}
  jira:
    url: ${JIRA_URL:}
    token: ${JIRA_TOKEN:}
    epic-link-field: ${JIRA_EPIC_LINK_FIELD:customfield_10014}
  cybertrack:
    url: ${CYBERTRACK_URL:}
    token: ${CYBERTRACK_TOKEN:}
    project-key: ${CYBERTRACK_PROJECT_KEY:SCP}
    issue-type: ${CYBERTRACK_ISSUE_TYPE:Task}
    poll: ${CYBERTRACK_POLL:PT5M}
    closed-statuses: ${CYBERTRACK_CLOSED_STATUSES:Done,Closed,Resolved,Cancelled,Canceled,Rejected,Won't Do}
    max-misses: ${CYBERTRACK_MAX_MISSES:12}
  confluence:
    url: ${CONFLUENCE_URL:}
    token: ${CONFLUENCE_TOKEN:}
  qtest:
    url: ${QTEST_URL:}
    token: ${QTEST_TOKEN:}
    concurrency: ${QTEST_CONCURRENCY:8}
    budget: ${QTEST_BUDGET:20s}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:${BEADLE_INTERNAL_DATA_DIR:${user.home}/beadle-internal}/beadle-internal;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
management:
  endpoint:
    health:
      show-details: always
beadle:
  cybertrack:
    poll: ${CYBERTRACK_POLL:PT10S}
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
---
spring:
  config:
    activate:
      on-profile: rd
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
logging:
  level:
    com.bbh.itss.beadle: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
