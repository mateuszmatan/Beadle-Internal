apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beadle-internal
      app.kubernetes.io/part-of: beadle
# No Route: only Beadle-GUI calls the API, inside the cluster through the Service (http://beadle-internal:8082), so
# nothing of Beadle-Internal is published outside it.
resources:
  - deployment.yaml
  - service.yaml
# Only what differs from application.yml; SPRING_PROFILES_ACTIVE and the system URLs are set by the overlays.
configMapGenerator:
  - name: beadle-internal-config
    literals:
      - BEADLE_GUI_URL=http://beadle:8081
