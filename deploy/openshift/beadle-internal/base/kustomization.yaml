apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beadle-internal
      app.kubernetes.io/part-of: beadle
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: beadle-internal-config
    literals:
      - SPRING_PROFILES_ACTIVE=rd
      - BEADLE_GUI_URL=http://beadle:8081
      - JIRA_URL=
      - CYBERTRACK_URL=
      - CYBERTRACK_PROJECT_KEY=SCP
      - CYBERTRACK_ISSUE_TYPE=Task
      - CYBERTRACK_POLL=PT5M
      - CONFLUENCE_URL=
      - QTEST_URL=
